<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gute Dinge">
<meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<title>gute dinge des tages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f7f7;
  --ink: #111111;
  --soft: #9b9b9b;
  --line: #e2e2e2;
  --head: 196px;                       /* Höhe des Kopfbereichs */
  --cols: minmax(16px, 1fr) 83px 83px minmax(0, 337px) minmax(0, 337px) 92px minmax(16px, 1fr);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #111111; --ink: #ececec; --soft: #777777; --line: #2a2a2a; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #111111; --ink: #ececec; --soft: #777777; --line: #2a2a2a; color-scheme: dark; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 14px; line-height: 1.25; -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

.page { position: relative; min-height: 100vh; padding-bottom: 80px; }
.grid { display: grid; grid-template-columns: var(--cols); }
.grid > * { padding: 0 16px 0 8px; min-width: 0; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .02em; }

/* Haarlinien – liegen als Raster hinter allem */
.rules { position: absolute; inset: 0; pointer-events: none; }
.rules i { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); }
.rules .r-date, .rules .r-a { top: calc(var(--head) + 28px); }

/* Kopf */
.top { height: var(--head); border-bottom: 1px solid var(--line); }
.top .compose { grid-column: 3 / 6; align-self: end; padding-bottom: 10px; }
.top .count { grid-column: 2 / 4; grid-row: 1; padding-top: 8px; white-space: pre-line; }
#text {
  width: 100%; border: 0; background: transparent; padding: 0; border-radius: 0;
  font-size: 22px; letter-spacing: -.01em; -webkit-appearance: none;
}
#text::placeholder { color: var(--soft); }
#text:focus { outline: none; }

/* Navigation */

.nav a { color: var(--soft); text-decoration: none; }
.nav a[aria-current="page"] { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.top .backtitle { color: var(--soft); grid-column: 3 / 6; align-self: end; padding-bottom: 10px; font-size: 22px; letter-spacing: -.01em; }
.back-empty { grid-column: 4 / 6; color: var(--soft); padding-top: 48px; }

/* Werkzeugzeile */
.tools > * { border-bottom: 1px solid var(--line); height: 28px; display: flex; align-items: center; font-size: 11px; }
.tools .tspace { grid-column: 2; }
.tools .when { grid-column: 3 / 5; gap: 14px; }
.tools .nav { grid-column: 5; justify-content: flex-end; gap: 12px; }
.when button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--soft); }
.when button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.when .other { position: relative; }
/* unsichtbares Datumsfeld – öffnet nur den Kalender des Systems */
.when input[type="date"] { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; border: 0; padding: 0; }
.status { grid-column: 3 / 6; font-size: 11px; color: var(--soft); min-height: 14px; padding-top: 6px; }

/* Spaltenköpfe */
/* ANNE / HANNAH stehen in der zeile des ersten (aktuellen) monats */
.month.first { padding-top: 66px; }
.month .who { grid-row: 1; align-self: end; padding-bottom: 8px; }
.month .who.a { grid-column: 4; }
.month .who.b { grid-column: 5; }

/* Liste */
/* Jahre: Burger-Menü in der rechten Spalte */
.yearsbar { position: absolute; top: var(--head); bottom: 0; left: 0; right: 0; pointer-events: none; z-index: 3; align-items: start; }
.yearsbar > .ycol { grid-column: 6 / 8; position: sticky; top: 0; padding: 0; pointer-events: auto; }   /* bleibt beim scrollen erreichbar */
.burger { position: absolute; left: 8px; top: 5px; width: 24px; height: 18px; border: 0; background: none; padding: 0; cursor: pointer; z-index: 2; }
.burger i { position: absolute; left: 0; width: 16px; height: 1px; background: var(--ink); transition: transform .45s cubic-bezier(.2, .7, .2, 1), opacity .25s ease; }
.burger i:nth-child(1) { top: 3px; }
.burger i:nth-child(2) { top: 8px; }
.burger i:nth-child(3) { top: 13px; }
.yopen .burger i:nth-child(1) { transform: translateY(5px) rotate(45deg); }
.yopen .burger i:nth-child(2) { transform: scaleX(0); opacity: 0; }
.yopen .burger i:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }

.ylist { list-style: none; margin: 0; padding: 0; visibility: hidden; transition: visibility 0s linear .45s; }
.yopen .ylist { visibility: visible; transition: none; }
.ylist li { position: relative; height: var(--yrow, 100px); }
/* nur die linien bewegen sich: sie ziehen sich von rechts nach links auf, leicht versetzt */
.ylist li::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; border-bottom: 1px solid var(--line);
  transform: scaleX(0); transform-origin: right center;
  transition: transform .2s ease; transition-delay: 0s;
}
.yopen .ylist li::after { transform: scaleX(1); transition: transform .6s cubic-bezier(.2, .7, .2, 1); transition-delay: calc(var(--i) * 45ms); }
.ylist button {
  width: 100%; height: 100%; border: 0; background: none; padding: 0; cursor: pointer;
  font: inherit; font-size: 11px; color: var(--soft); opacity: 0;
}
.yopen .ylist button { opacity: 1; }
.ylist button[aria-current="true"] { color: var(--ink); }
.ylist button[aria-current="true"] span { text-decoration: underline; text-underline-offset: 3px; }
.ylist button:hover { color: var(--ink); }
.back-view .yearsbar { display: none; }
/* solange die jahre offen sind, verschwindet der rest */
.yopen #app { display: none; }
.yopen .top .compose { visibility: hidden; }
.yopen .rules .r-date, .yopen .rules .r-a { display: none; }
.yopen .rules .r-month { bottom: auto; height: var(--head); }
@media (prefers-reduced-motion: reduce) {
  .burger i, .ylist, .ylist li::after { transition: none !important; }
}

/* Monat: Name, darunter eine Linie, die den Monat abgrenzt */
.month { padding-top: 48px; }
.month .label { grid-column: 2; grid-row: 1; padding-bottom: 8px; white-space: pre-line; color: #9b9b9b; }
.month.current .label, .month .who { color: var(--ink); }
.month .rule { grid-column: 2 / 6; grid-row: 1; align-self: end; border-bottom: 1px solid var(--line); padding: 0; }
.day { padding-top: 26px; }
.month + .day { padding-top: 32px; }
.day .date { grid-column: 3; font-size: 11px; color: var(--soft); padding-top: 2px; white-space: nowrap; }
.day.is-today .date { color: var(--ink); }
.day .col { grid-column: 4; }
.day .col + .col { grid-column: 5; }
.col .line { margin: 0; overflow-wrap: anywhere; }
.col button.text { all: unset; white-space: pre-wrap; }
.col.mine button.text { cursor: pointer; }
.col.mine button.text:hover { color: var(--soft); }
.col .none { color: var(--line); }
.col textarea.edit {
  display: block; width: 100%; border: 0; border-bottom: 1px solid var(--ink); border-radius: 0;
  background: transparent; padding: 0 0 2px; resize: none; overflow: hidden; line-height: inherit; -webkit-appearance: none;
}
.col textarea.edit:focus { outline: none; }
.actions { display: flex; gap: 16px; margin-top: 8px; font-size: 11px; font-style: italic; }
.actions button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--soft); }
.actions .save { color: var(--ink); }
.actions .del { margin-left: auto; }
.actions .del.sure { color: var(--ink); }
.empty { grid-column: 4 / 6; color: var(--soft); padding-top: 32px; }

/* Einrichtung */
.setup { padding-top: 48px; }
.setup .box { grid-column: 4 / 6; max-width: 360px; }
.setup .lead { font-size: 22px; margin: 0 0 32px; }
.setup .label { display: block; margin: 0 0 8px; }
.setup .who { display: flex; gap: 16px; margin-bottom: 28px; }
.setup .who button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--soft); font-size: 16px; }
.setup .who button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.setup input { width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 0 0 6px; -webkit-appearance: none; }
.setup input:focus { outline: none; border-bottom-color: var(--ink); }
.setup .connect { margin-top: 24px; border: 0; background: none; padding: 0; font-style: italic; cursor: pointer; }
.setup .msg { font-size: 11px; color: var(--soft); margin-top: 12px; min-height: 14px; }

footer.grid { padding-top: 64px; font-size: 11px; color: var(--soft); }
footer .f { grid-column: 4 / 6; display: flex; justify-content: space-between; }
footer button { border: 0; background: none; padding: 0; color: var(--soft); cursor: pointer; font-size: 11px; }

/* Handy */
@media (max-width: 820px) {
  :root { --cols: 74px minmax(0, 1fr) minmax(0, 1fr); --head: auto; }
  .rules { display: none; }
  .top { height: auto; display: grid; grid-template-columns: 1fr auto; row-gap: 96px; padding: 10px 0 10px; }
  .top .count { grid-column: 1; grid-row: 1; padding-top: 0; }
  .top .compose, .top .backtitle { grid-column: 1 / -1; grid-row: 2; }
  .tools .nav { grid-column: 3; gap: 0; border-left: 0; }
  .nav a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; padding: 0 6px; }
  .nav a:last-child { padding-right: 0; }
  .back-empty { grid-column: 1 / -1; }
  #text { font-size: 19px; }
  .tools .when { grid-column: 1 / 3; }
  .tools .tspace { display: none; }
  .tools { border-bottom: 1px solid var(--line); }
  .tools > * { border-bottom: 0; }
  .status, .empty, .setup .box, footer .f { grid-column: 1 / -1; }
  .month.first { padding-top: 40px; }
  .month.first .label { grid-column: 1; }
  .month .who.a { grid-column: 2; }
  .month .who.b { grid-column: 3; }
  .month .label { grid-column: 1 / -1; }
  .month .rule { grid-column: 1 / -1; }
  /* Jahre auf dem Handy: Burger oben rechts, Liste als ganze Seite */
  .yearsbar { top: 0; bottom: auto; }
  .yearsbar > .ycol { grid-column: 1 / -1; position: static; height: 0; }
  .burger { left: auto; right: 4px; top: -3px; width: 44px; height: 44px; }
  .burger i { left: 14px; }
  .burger i:nth-child(1) { top: 16px; }
  .burger i:nth-child(2) { top: 21px; }
  .burger i:nth-child(3) { top: 26px; }
  .yopen .burger { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 7px); }
  .ylist {
    position: fixed; inset: 0; z-index: 1; overflow-y: auto; background: var(--bg);
    padding: calc(env(safe-area-inset-top, 0px) + 64px) 14px calc(env(safe-area-inset-bottom, 0px) + 24px);
  }
  .ylist li { height: 64px; }
  .ylist button { font-size: 13px; }
  .day .date { grid-column: 1; }
  .day .col { grid-column: 2; }
  .day .col + .col { grid-column: 3; }
  .grid { padding-left: 14px; padding-right: 14px; }
  .grid > * { padding: 0 10px 0 0; }
  .top > * { padding: 0; }
  .tools > * { padding: 0; }

  /* Touch-Flächen: mindestens 44 px hoch */
  .tools > * { height: 44px; }
  .tools .when { gap: 6px; font-size: 12px; }
  .when button, .when .other { display: flex; align-items: center; min-height: 44px; min-width: 44px; padding: 0 8px; }
  .when > button:first-child { padding-left: 0; }
  .when .other button { padding: 0; min-height: 44px; }

  .col.mine button.text { display: block; padding: 14px 0; margin: -14px 0; }
  .col.mine .none { display: block; }

  .actions { gap: 4px; margin-top: 2px; font-size: 12px; }
  .actions button { min-height: 44px; padding: 0 10px; }
  .actions button:first-child { padding-left: 0; }
  .actions .del { padding-right: 0; }


  .setup .who { gap: 8px; }
  .setup .who button { min-height: 44px; padding: 0 12px; }
  .setup .who button:first-child { padding-left: 0; }
  .setup .connect { min-height: 44px; padding: 0 12px 0 0; margin-top: 16px; }
  footer button { min-height: 44px; padding: 0 0 0 16px; }
  footer .f { align-items: center; }
}
</style>
</head>
<body>
<div class="page">
  <div class="rules grid" aria-hidden="true"></div>

  <div class="yearsbar grid" id="yearsbar">
    <div class="ycol">
      <button type="button" class="burger" id="burger" aria-label="Jahre anzeigen" aria-expanded="false" aria-controls="ylist"><i></i><i></i><i></i></button>
      <ol class="ylist" id="ylist"></ol>
    </div>
  </div>

  <header class="top grid">
    <div class="backtitle" id="backtitle" hidden>an diesem tag</div>
    <div class="compose" id="compose">
      <input type="text" id="text" placeholder="was war heute schön?" autocomplete="off" enterkeyhint="done" aria-label="Moment eintragen">
    </div>
    <div class="count label" id="count">gute dinge
des tages</div>
  </header>

  <div id="app">
    <div class="tools grid" id="tools">
      <div class="tspace"></div>
      <div class="when" role="group" aria-label="Tag">
        <button type="button" data-ago="0" aria-pressed="true">heute</button>
        <button type="button" data-ago="1" aria-pressed="false">gestern</button>
        <span class="other"><button type="button" id="otherBtn" aria-pressed="false">anderer tag</button><input type="date" id="datepick" tabindex="-1" aria-hidden="true"></span>
      </div>
      <nav class="nav" aria-label="Seiten">
        <a href="#" data-view="list">Einträge</a>
        <a href="#rueckblick" data-view="back">Rückblick</a>
      </nav>
    </div>
    <div class="grid"><div class="status" id="status" aria-live="polite"></div></div>

    <div id="list"></div>

    <footer class="grid"><div class="f"><span id="mode"></span><button type="button" id="logout">abmelden</button></div></footer>
  </div>

  <section class="setup grid" id="setup" hidden>
    <div class="box">
      <p class="lead">einmal einrichten</p>
      <p class="label">wer bist du?</p>
      <div class="who" id="who"></div>
      <label class="label" for="token">zugangsschlüssel</label>
      <input type="password" id="token" autocomplete="off" placeholder="github_pat_…">
      <button type="button" class="connect" id="connect">verbinden</button>
      <div class="msg" id="setupStatus" aria-live="polite"></div>
    </div>
  </section>
</div>

<script src="store.js"></script>
<script>
function pad(n) { return String(n).padStart(2, "0"); }
function ymd(x) { return x.getFullYear() + "-" + pad(x.getMonth() + 1) + "-" + pad(x.getDate()); }
function ago(n) { const x = new Date(); x.setDate(x.getDate() - n); return ymd(x); }
function shortDate(v) { const [, m, d] = v.split("-"); return d + "." + m + "."; }
function dayLabel(v) {
  const wd = new Date(v + "T12:00").toLocaleDateString("de-DE", { weekday: "short" }).replace(".", "");
  return wd + " " + shortDate(v);
}

const $ = (s) => document.querySelector(s);
const textEl = $("#text"), listEl = $("#list"), statusEl = $("#status"), dateEl = $("#datepick");
let rows = [], selected = ago(0), editing = null;
const [A, B] = Store.people;                 // A immer links, B immer rechts

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

/* ---------- Raster-Linien ---------- */
(function drawRules() {
  const r = $(".rules");
  // eine leere Zelle pro Spalte; Linien sitzen links von Monat, Datum, Anne und rechter Spalte
  ["", "r-month", "r-date", "r-a", "", "r-right", ""].forEach((c) => { const i = el("div"); i.style.position = "relative"; i.style.padding = "0"; if (c) i.appendChild(el("i", c)); r.appendChild(i); });
})();

/* ---------- Tag wählen ---------- */
dateEl.max = ago(0);
function setDate(v) {
  selected = v;
  document.querySelectorAll(".when button[data-ago]").forEach((b) =>
    b.setAttribute("aria-pressed", String(ago(+b.dataset.ago) === v)));
  const custom = v !== ago(0) && v !== ago(1);
  $("#otherBtn").setAttribute("aria-pressed", String(custom));
  $("#otherBtn").textContent = custom ? shortDate(v) : "anderer tag";
  textEl.placeholder = v === ago(0) ? "was war heute schön?" : v === ago(1) ? "was war gestern schön?" : "was war am " + shortDate(v) + " schön?";
}
// im rückblick zeigt die auswahl frühere jahre zu diesem tag, sonst springt sie ins eingabefeld
function picked(v) {
  setDate(v);
  if (view === "back") render(); else textEl.focus();
}
document.querySelectorAll(".when button[data-ago]").forEach((b) =>
  b.addEventListener("click", () => picked(ago(+b.dataset.ago))));
dateEl.addEventListener("change", () => { if (dateEl.value) picked(dateEl.value); });

// "anderer tag" öffnet den Kalender von macOS bzw. iOS
let pickerOpen = false;
function closePicker() { if (pickerOpen) { pickerOpen = false; dateEl.blur(); } }
$("#otherBtn").addEventListener("click", (e) => {
  if (pickerOpen) { closePicker(); return; }             // zweiter klick schließt
  dateEl.value = selected;
  dateEl.focus({ preventScroll: true });
  pickerOpen = true;
  try {
    if (typeof dateEl.showPicker === "function") { dateEl.showPicker(); return; }
  } catch (err) {}
  dateEl.click();                                         // ältere browser
});
// klick oder tipp irgendwo anders schließt den kalender
document.addEventListener("pointerdown", (e) => {
  if (pickerOpen && !e.target.closest(".other")) closePicker();
}, true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePicker(); });
dateEl.addEventListener("blur", () => { pickerOpen = false; });
dateEl.addEventListener("change", () => { pickerOpen = false; });

/* ---------- Eintragen ---------- */
textEl.addEventListener("keydown", async (e) => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const text = textEl.value.trim();
  if (!text || !Store.ready()) return;
  textEl.disabled = true;
  status("speichere …");
  try {
    rows = await Store.add({ date: selected, text });
    textEl.value = "";
    setDate(ago(0));
    status(Store.isDemo ? "gespeichert" : "wird gesendet …");
    render();
  } catch (err) {
    status(errText(err, "nicht gespeichert – bitte noch einmal"));
  } finally {
    textEl.disabled = false; textEl.focus();
  }
});

let statusTimer;
function waiting() {
  const n = Store.pending();
  return !n ? "" : n === 1 ? "1 eintrag wartet auf verbindung" : n + " einträge warten auf verbindung";
}
function status(msg) {
  statusEl.textContent = msg;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => (statusEl.textContent = waiting()), 2500);
}
function errText(e, fallback) {
  if (e && e.code === "auth") return e.message + " – bitte neu einrichten";
  if (e && e.code === "offline") return "keine verbindung";
  if (e && e.code === "too_big") return e.message;
  return fallback;
}

/* ---------- Bearbeiten ---------- */
function grow(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

// Bearbeiten-Modus für alle Momente einer Person an einem Tag
function editor(date, text) {
  const box = el("div", "editbox");
  const ta = el("textarea", "edit");
  ta.value = text; ta.rows = 1; ta.setAttribute("aria-label", "Tag bearbeiten"); ta.setAttribute("enterkeyhint", "done");
  const actions = el("div", "actions");
  const save = el("button", "save", "speichern"), cancel = el("button", "", "abbrechen"), del = el("button", "del", "löschen");
  [save, cancel, del].forEach((b) => (b.type = "button"));

  let done = false;
  async function write(value) {
    if (done) return;
    done = true;
    editing = null;
    try { rows = await Store.setDay(date, value); }      // sofort lokal gespeichert, gesendet wird im hintergrund
    catch (e) { status(errText(e, "nicht gespeichert – bitte noch einmal")); }
    render();
  }
  function commit() {
    const value = ta.value.trim();
    if (value === text) { stop(); return; }
    write(value);
  }
  function stop() { if (done) return; done = true; editing = null; render(); }

  ta.addEventListener("input", () => grow(ta));
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); commit(); }
    if (e.key === "Escape") { e.preventDefault(); stop(); }
  });
  save.addEventListener("click", commit);
  cancel.addEventListener("click", stop);
  del.addEventListener("click", () => {
    if (!del.classList.contains("sure")) { del.classList.add("sure"); del.textContent = "wirklich löschen?"; return; }
    write("");
  });
  // iPhone: tipp auf einen knopf soll die tastatur nicht zuerst schließen (sonst verrutscht der knopf)
  [save, cancel, del].forEach((b) => b.addEventListener("mousedown", (e) => e.preventDefault()));
  actions.append(save, cancel, del);
  box.append(ta, actions);
  requestAnimationFrame(() => { grow(ta); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); });
  return box;
}

/* ---------- Liste ---------- */
// Alle Momente einer Person an einem Tag als eine Zeile, mit Komma getrennt
function column(date, items, who, readonly) {
  const mine = !readonly && who === Store.me();
  const col = el("div", "col" + (mine ? " mine" : ""));
  const text = items.filter((m) => m.author === who).map((m) => m.text).join(", ");
  if (mine && editing === date) { col.appendChild(editor(date, text)); return col; }
  if (!text) {
    col.appendChild(el("span", "none", "—"));
    return col;
  }
  const t = el("button", "text", text);
  t.type = "button";
  if (mine) { t.title = "Tippen zum Bearbeiten"; t.addEventListener("click", () => { editing = date; render(); }); }
  else t.tabIndex = -1;
  const p = el("p", "line"); p.appendChild(t); col.appendChild(p);
  return col;
}

/* ---------- Seiten ---------- */
let view = location.hash === "#rueckblick" ? "back" : "list";
function showView() {
  view = location.hash === "#rueckblick" ? "back" : "list";
  editing = null;
  document.querySelectorAll(".nav a").forEach((a) => {
    if (a.dataset.view === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  const back = view === "back";
  $("#compose").hidden = back; $("#backtitle").hidden = !back;
  setDate(ago(0));                                   // beim seitenwechsel wieder auf heute
  page.classList.toggle("back-view", back);
  if (back) closeYears();
  render();
  window.scrollTo(0, 0);
}
document.querySelectorAll(".nav a").forEach((a) => a.addEventListener("click", (e) => {
  // "einträge" mit leerem hash: nicht zum seitenanfang springen lassen, sondern ansicht wechseln
  if (a.dataset.view === "list") { e.preventDefault(); history.replaceState(null, "", location.pathname + location.search); showView(); }
}));
window.addEventListener("hashchange", showView);

/* ---------- Rückblick: dieser Kalendertag in früheren Monaten und Jahren ---------- */
function renderBack() {
  const today = new Date(selected + "T12:00");           // gewählter tag: heute, gestern oder anderer tag
  $("#backtitle").textContent = selected === ago(0) ? "an diesem tag"
    : "am " + today.toLocaleDateString("de-DE", { day: "numeric", month: "long" }).toLowerCase();
  const sections = [];
  const month = new Date(today); month.setMonth(today.getMonth() - 1);
  if (month.getDate() === today.getDate()) sections.push(["vor einem monat", ymd(month)]);
  const oldest = rows.reduce((min, r) => (r.date < min ? r.date : min), ymd(today));
  for (let y = 1; ; y++) {
    const d = new Date(today); d.setFullYear(today.getFullYear() - y);
    if (ymd(d) < oldest) break;
    if (d.getDate() !== today.getDate()) continue;      // z. B. 29. Februar
    sections.push([y === 1 ? "vor einem jahr" : "vor " + y + " jahren", ymd(d)]);
  }
  let shown = 0;
  sections.forEach(([label, key]) => {
    const items = rows.filter((r) => r.date === key);
    if (!items.length) return;
    const head = monthRow(label, !shown);
    const row = el("section", "day grid");
    row.appendChild(el("div", "date", dayLabel(key) + key.slice(2, 4)));   // mit jahr, z. B. "So 05.10.25"
    row.append(column(key, items, A, true), column(key, items, B, true));
    listEl.append(head, row);
    shown++;
  });
  if (!shown) {
    const g = el("div", "grid");
    g.appendChild(el("div", "back-empty", selected === ago(0) ? "an diesem tag gibt es noch keine erinnerungen. in einem monat steht hier der erste rückblick." : "zu diesem tag gibt es noch keine erinnerungen."));
    listEl.appendChild(g);
  }
}

// monatszeile: name + linie; die erste zeile trägt zusätzlich ANNE und HANNAH
function monthRow(text, first, current) {
  const row = el("div", "month grid" + (first ? " first" : "") + (current ? " current" : ""));
  row.appendChild(el("div", "label", text));
  if (first) row.append(el("div", "who a label", A), el("div", "who b label", B));
  row.appendChild(el("div", "rule"));
  return row;
}

function render() {
  listEl.textContent = "";
  // gezählt wird jeder mit Komma getrennte Moment einzeln
  const n = rows.reduce((sum, r) => sum + r.text.split(",").filter((s) => s.trim()).length, 0);
  $("#count").textContent = n + " gute dinge\ndes tages";
  renderYears();
  if (view === "back") { renderBack(); return; }

  // nur das gewählte jahr anzeigen
  const byDay = new Map();
  rows.forEach((r) => {
    if (!r.date.startsWith(shownYear)) return;
    if (!byDay.has(r.date)) byDay.set(r.date, []);
    byDay.get(r.date).push(r);
  });
  if (shownYear === ago(0).slice(0, 4) && !byDay.has(ago(0))) byDay.set(ago(0), []);
  const days = [...byDay.keys()].sort().reverse();

  let lastMonth = "";
  days.forEach((key) => {
    const month = key.slice(0, 7);
    if (month !== lastMonth) {
      const [y, mo] = month.split("-");
      listEl.appendChild(monthRow(new Date(+y, +mo - 1, 1).toLocaleDateString("de-DE", { month: "long" }) + "\n" + y, !lastMonth, month === ago(0).slice(0, 7)));
      lastMonth = month;
    }
    const items = byDay.get(key).slice().sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
    const row = el("section", "day grid" + (key === ago(0) ? " is-today" : ""));
    row.appendChild(el("div", "date", dayLabel(key)));
    row.append(column(key, items, A), column(key, items, B));
    listEl.appendChild(row);
  });
  requestAnimationFrame(alignYears);
  if (!days.length) {
    const g = el("div", "grid");
    g.appendChild(el("div", "empty", rows.length ? "in " + shownYear + " gibt es keine einträge." : "noch nichts eingetragen."));
    listEl.appendChild(g);
  }
}

/* ---------- Jahre: Burger-Menü ---------- */
// zwei jahreszeilen = abstand von der kopflinie bis zur linie unter ANNE/HANNAH
function alignYears() {
  if (mobile.matches) { ylist.style.removeProperty("--yrow"); return; }
  const rule = listEl.querySelector(".month.first .rule");
  if (!rule) return;
  const top = $("#yearsbar").getBoundingClientRect().top;
  const h = (rule.getBoundingClientRect().bottom - top) / 2;
  if (h > 20) ylist.style.setProperty("--yrow", h + "px");
}
window.addEventListener("resize", alignYears);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignYears);
let shownYear = ago(0).slice(0, 4);
const page = $(".page"), burger = $("#burger"), ylist = $("#ylist");
const mobile = window.matchMedia("(max-width: 820px)");

function allYears() {
  const now = +ago(0).slice(0, 4);
  const oldest = +rows.reduce((min, r) => (r.date < min ? r.date : min), ago(0)).slice(0, 4);
  const list = [];
  for (let y = now; y >= oldest; y--) list.push(String(y));
  return list;
}
function renderYears() {
  const years = allYears();
  // nur neu aufbauen, wenn neue jahre dazukommen – sonst nur die markierung umsetzen (animation bleibt ruhig)
  const key = years.join();
  if (ylist.dataset.key === key) {
    ylist.querySelectorAll("button").forEach((b) => {
      if (b.textContent === shownYear) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
    });
    return;
  }
  ylist.dataset.key = key;
  ylist.textContent = "";
  years.forEach((y, i) => {
    const li = el("li"); li.style.setProperty("--i", i);
    const b = el("button"); b.type = "button"; b.appendChild(el("span", "", y));
    if (y === shownYear) b.setAttribute("aria-current", "true");
    b.addEventListener("click", () => showYear(y));
    li.appendChild(b); ylist.appendChild(li);
  });
}
function showYear(y) {
  shownYear = y; editing = null;
  render();
  closeYears();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function openYears() {
  page.classList.add("yopen");
  burger.setAttribute("aria-expanded", "true"); burger.setAttribute("aria-label", "Jahre schließen");
  if (mobile.matches) document.documentElement.style.overflow = "hidden";
}
function closeYears() {
  page.classList.remove("yopen");
  burger.setAttribute("aria-expanded", "false"); burger.setAttribute("aria-label", "Jahre anzeigen");
  document.documentElement.style.overflow = "";
}
burger.addEventListener("click", () => (page.classList.contains("yopen") ? closeYears() : openYears()));
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && page.classList.contains("yopen")) closeYears(); });

async function refresh(quiet) {
  if (editing) return;
  const before = Store.pending();
  try {
    rows = await Store.load(); render();
    if (before && !Store.pending()) status("alles gesendet");
  } catch (e) {
    if (e && e.rows) { rows = e.rows; render(); }        // offline: letzter bekannter Stand
    if (!quiet) status(errText(e, "konnte nicht laden"));
    else if (!statusEl.textContent) statusEl.textContent = waiting();
    if (e && e.code === "auth") { Store.logout(); showSetup(); }
  }
}

// rückmeldung, sobald im hintergrund gesendet wurde (oder eben nicht)
Store.onSync(({ ok, error }) => {
  rows = Store.snapshot();
  if (!editing) render();
  if (ok) status("gespeichert");
  else if (error && error.code === "auth") { status(errText(error, "")); Store.logout(); showSetup(); }
  else if (error && (error.code === "offline" || error.code === "network")) status("ohne netz gemerkt – wird gesendet, sobald du wieder verbindung hast");
  else status("nicht gesendet – wird später noch einmal versucht");
});

/* ---------- Einrichtung ---------- */
let chosen = "";
function showSetup() {
  $("#app").hidden = true; $("#setup").hidden = false;
  textEl.disabled = true;
  const who = $("#who"); who.textContent = "";
  Store.people.forEach((p) => {
    const b = el("button", "", p); b.type = "button"; b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => { chosen = p; who.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); });
    who.appendChild(b);
  });
}
$("#connect").addEventListener("click", async () => {
  const token = $("#token").value.trim(), msg = $("#setupStatus");
  if (!chosen) { msg.textContent = "bitte wähle deinen namen"; return; }
  if (!token) { msg.textContent = "bitte den zugangsschlüssel einfügen"; return; }
  msg.textContent = "verbinde …";
  try { await Store.setup({ token, me: chosen }); $("#token").value = ""; msg.textContent = ""; startApp(); }
  catch (e) { msg.textContent = errText(e, "verbindung fehlgeschlagen"); }
});
$("#logout").addEventListener("click", () => {
  if (Store.isDemo || !confirm("auf diesem gerät abmelden?")) return;
  Store.logout(); showSetup();
});

/* ---------- Start ---------- */
let started = false;
function startApp() {
  $("#setup").hidden = true; $("#app").hidden = false; textEl.disabled = false;

  $("#mode").textContent = Store.isDemo ? "demo – nichts wird gespeichert" : "angemeldet als " + Store.me();
  $("#logout").hidden = Store.isDemo;
  setDate(ago(0)); rows = Store.snapshot(); showView(); refresh(true);
  if (started) return;
  started = true;
  window.addEventListener("online", () => refresh(true));   // netz ist zurück → wartendes senden
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(true); });
  setInterval(() => { if (!document.hidden) refresh(true); }, 60000);
}
if (Store.ready()) startApp(); else showSetup();
